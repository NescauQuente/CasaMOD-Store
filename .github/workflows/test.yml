name: Tests

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vet and format
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"

      - name: Go tests
        run: go test -race ./...

      - name: Browser tests
        run: CHROME_BIN="$(which google-chrome)" node tests/run.mjs

      - name: Docker build (amd64)
        run: docker build -t casamod-store:test .
